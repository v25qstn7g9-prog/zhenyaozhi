<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>針藥誌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FBF6F3;
    --surface:#FFFFFF;
    --surface-2:#F7EFEB;
    --ink:#2A211F;
    --ink-soft:#7B6B66;
    --ink-faint:#AC9C97;
    --line:#F0E4DF;
    --accent:#D9826F;      /* terracotta - main brand */
    --accent-deep:#C46C5A;
    --accent-soft:#FBEAE5;
    --teal:#C46C5A;        /* kept name: primary actions / progress */
    --teal-soft:#FBEAE5;
    --sage:#7FA48F;        /* goal line */
    --gold:#E9A55C;
    --warn:#C0432E;
    --warn-soft:#F8E0DA;
    --hero-from:#D98A77;
    --hero-to:#C26A58;
    --shadow: 0 1px 2px rgba(80,40,30,.04), 0 10px 28px -14px rgba(120,60,45,.22);
    --font-display:'Nunito',ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Helvetica Neue',sans-serif;
    --font-mono:'Nunito',ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif;
    --radius:24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1513; --surface:#241D1A; --surface-2:#2E2521;
      --ink:#F5ECE8; --ink-soft:#BBA9A2; --ink-faint:#86746D; --line:#3A2F2A;
      --accent:#E4917E; --accent-deep:#D9826F; --accent-soft:#3A2722;
      --teal:#E4917E; --teal-soft:#3A2722; --sage:#8FB8A1;
      --warn:#E27D68; --warn-soft:#3A2320;
      --hero-from:#B9705F; --hero-to:#94503F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1513; --surface:#241D1A; --surface-2:#2E2521;
    --ink:#F5ECE8; --ink-soft:#BBA9A2; --ink-faint:#86746D; --line:#3A2F2A;
    --accent:#E4917E; --accent-deep:#D9826F; --accent-soft:#3A2722;
    --teal:#E4917E; --teal-soft:#3A2722; --sage:#8FB8A1;
    --warn:#E27D68; --warn-soft:#3A2320;
    --hero-from:#B9705F; --hero-to:#94503F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  /* ---- header: AI pill · title · day count ---- */
  header.top{
    position:sticky;top:0;z-index:20;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .ai-pill{
    justify-self:start;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;
    border:1.5px solid var(--accent);border-radius:99px;background:transparent;color:var(--accent-deep);
    font-weight:700;font-size:14px;cursor:pointer;
  }
  .ai-pill svg{width:15px;height:15px;}
  header.top .brand{font-weight:800;font-size:20px;letter-spacing:.02em;white-space:nowrap;}
  header.top .brand small{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-soft);margin-left:6px;}
  header.top .day-badge{
    justify-self:end;font-family:var(--font-display);font-weight:700;font-size:12px;color:#5A3A12;
    background:linear-gradient(120deg,#F7D29B,var(--gold));border-radius:99px;padding:7px 12px;white-space:nowrap;
  }

  main{flex:1;padding:6px 16px calc(112px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
  section.view{display:none;flex-direction:column;gap:14px;}
  section.view.active{display:flex;animation:fadeUp .22s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){section.view.active{animation:none;}}

  .card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card h2{margin:0 0 2px;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:.01em;}
  .card > h2 + :not(.card-sub){margin-top:12px;}
  .card .card-sub{margin:0 0 12px;font-size:13px;color:var(--ink-soft);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
  .card-head h2{margin:0;}
  .card-head .muted{font-size:13px;color:var(--ink-soft);}
  .num{font-family:var(--font-display);font-variant-numeric:tabular-nums;}

  /* ---- hero ---- */
  .hero{
    background:linear-gradient(140deg,var(--hero-from) 0%,var(--hero-to) 100%);
    color:#FFF8F5;border-radius:28px;padding:20px 20px 18px;box-shadow:0 14px 30px -16px rgba(170,80,60,.55);
    position:relative;overflow:hidden;
  }
  .hero::before,.hero::after{content:'';position:absolute;border-radius:50%;pointer-events:none;}
  .hero::before{width:190px;height:190px;right:-60px;bottom:-80px;background:rgba(255,255,255,.10);}
  .hero::after{width:110px;height:110px;right:40px;bottom:-60px;background:rgba(255,255,255,.08);}
  .hero .eyebrow{font-size:15px;opacity:.9;font-weight:600;display:flex;align-items:center;gap:6px;}
  .hero .big{font-family:var(--font-display);font-size:58px;font-weight:900;line-height:1;margin:10px 0 8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .hero .big span{font-size:22px;font-weight:700;opacity:.8;margin-left:6px;letter-spacing:0;}
  .hero .sub{font-size:15px;font-weight:600;opacity:.95;margin-bottom:14px;}
  .hero .bar{height:9px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-bottom:8px;position:relative;z-index:1;}
  .hero .bar > i{display:block;height:100%;background:#FFF;border-radius:99px;}
  .hero .bar-labels{display:flex;justify-content:space-between;font-family:var(--font-display);font-weight:700;font-size:13px;opacity:.9;position:relative;z-index:1;}
  .hero .cd-chip{
    position:absolute;top:16px;right:16px;z-index:1;text-align:center;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:9px 14px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .hero .cd-chip b{font-family:var(--font-display);font-size:22px;font-weight:900;}
  .hero .cd-chip small{font-size:12px;font-weight:600;margin-left:2px;}
  .hero .cd-chip div{font-size:12px;opacity:.9;font-weight:600;margin-top:2px;}
  .hero .cd-chip.overdue{background:rgba(120,30,20,.28);border-color:rgba(255,255,255,.45);}

  /* ---- stat tiles ---- */
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-tile{background:var(--surface);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow);position:relative;}
  .stat-tile .label{font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;white-space:nowrap;}
  .stat-tile .value{font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat-tile .value small{font-size:13px;font-weight:700;color:var(--ink-soft);margin-left:2px;}
  .stat-tile .value.accent{color:var(--gold);}
  .stat-tile .value.teal{color:var(--accent-deep);}

  /* ---- buttons ---- */
  .action-row{display:flex;gap:10px;}
  .btn{
    font-weight:800;font-size:16px;border-radius:20px;min-height:56px;padding:0 16px;
    border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;flex:1;
    transition:transform .12s ease, filter .15s ease;
  }
  .btn svg{flex:none;}
  .btn:active{transform:scale(.97);}
  .btn.primary,.btn.teal{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(196,108,90,.8);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;flex:none;}
  .btn.icon-only{flex:0 0 64px;padding:0;color:var(--accent-deep);}
  .btn.small{min-height:36px;padding:0 14px;font-size:13px;border-radius:12px;flex:none;}
  .btn.danger{color:var(--warn);border-color:var(--warn-soft);}
  .btn.small.danger{background:var(--warn);border-color:var(--warn);color:#fff;}
  .btn:disabled{opacity:.55;}
  a.btn{text-decoration:none;}

  .ai-preview{
    font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;line-height:1.65;white-space:pre-wrap;
    background:var(--surface-2);border-radius:14px;padding:12px;max-height:240px;overflow-y:auto;color:var(--ink-soft);
  }

  /* ---- segmented control ---- */
  .seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--ink-soft);font-size:15px;font-weight:700;padding:10px 4px;border-radius:12px;cursor:pointer;}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px rgba(120,60,45,.18);}

  /* ---- chart ---- */
  svg.chart{width:100%;height:auto;display:block;overflow:visible;}
  svg.chart text{font-family:var(--font-display);font-weight:600;fill:var(--ink-soft);}
  svg.chart .tip-bg{fill:var(--ink);}
  svg.chart .tip-tx{fill:var(--surface);font-weight:700;}
  .chart-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .chart-legend span{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;font-weight:600;}
  .chart-legend i{width:16px;height:3px;border-radius:2px;display:inline-block;}

  /* ---- weight summary ---- */
  .total-line{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;color:var(--ink-soft);font-size:15px;font-weight:600;}
  .total-line b{font-family:var(--font-display);font-size:28px;font-weight:900;color:var(--accent-deep);}
  .summary-grid{display:flex;gap:16px;align-items:center;}
  .summary-grid .ring-wrap{position:relative;width:132px;height:132px;flex:none;}
  .summary-grid .ring-wrap .ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  .summary-grid .ring-wrap .ring-val b{font-family:var(--font-display);font-size:20px;white-space:nowrap;font-weight:900;color:var(--accent-deep);}
  .summary-grid .ring-wrap .ring-val small{font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:600;}
  .kv-list{flex:1;display:flex;flex-direction:column;}
  .kv-row{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;border-bottom:1px solid var(--line);padding:11px 0;gap:8px;}
  .kv-row:first-child{padding-top:0;}
  .kv-row:last-child{border:none;padding-bottom:0;}
  .kv-row .k{color:var(--ink-soft);font-weight:600;}
  .kv-row .v{font-family:var(--font-display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;}
  .kv-row .v small{font-size:13px;font-weight:700;color:var(--ink-soft);margin-left:2px;}
  .kv-row .v em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--ink-faint);text-align:right;}

  /* ---- records ---- */
  .table-scroll{overflow-x:auto;margin:0 -18px -18px;border-radius:0 0 var(--radius) var(--radius);}
  table.rec{width:100%;border-collapse:collapse;font-size:15px;min-width:100%;}
  table.rec th{text-align:left;font-size:13px;color:var(--ink-soft);font-weight:600;padding:10px 8px;white-space:nowrap;background:var(--surface);border-bottom:1px solid var(--line);}
  table.rec td{padding:14px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.rec td.num{font-family:var(--font-display);font-weight:700;}
  table.rec td.strong{font-weight:900;color:var(--accent-deep);font-size:17px;}
  table.rec tr td:first-child, table.rec tr th:first-child{padding-left:18px;}
  table.rec tr.month td{background:var(--surface-2);color:var(--ink-soft);font-weight:700;font-size:14px;padding:9px 18px;border-top:none;}
  .row-actions{text-align:right;padding-right:12px !important;}
  .icon-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:6px;border-radius:10px;}
  .icon-btn:hover{color:var(--warn);background:var(--warn-soft);}
  .empty-row td{color:var(--ink-faint);text-align:center;padding:22px 6px;}

  .shot-list{list-style:none;margin:0 -18px -18px;padding:0;}
  .shot-list .month{background:var(--surface-2);color:var(--ink-soft);font-weight:700;font-size:14px;padding:9px 18px;}
  .shot-item{display:grid;grid-template-columns:44px 1fr auto auto;align-items:center;gap:12px;padding:12px 10px 12px 18px;border-top:1px solid var(--line);}
  .shot-item .idx{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:17px;}
  .shot-item .site{font-weight:800;font-size:16px;}
  .shot-item .when{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .shot-item .dose{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--accent-deep);}
  .shot-item .dose small{font-size:13px;color:var(--ink-soft);font-weight:700;margin-left:3px;}
  .shot-list .empty{padding:22px;text-align:center;color:var(--ink-faint);border-top:1px solid var(--line);}

  /* ---- calendar ---- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-head .m-label{font-weight:800;font-size:17px;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav button{width:44px;height:40px;border-radius:14px;border:none;background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center;}
  .cal-grid .dow{font-size:13px;color:var(--ink-faint);padding-bottom:6px;font-weight:600;}
  .cal-grid .day{height:40px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:600;position:relative;color:var(--ink);font-family:var(--font-display);}
  .cal-grid .day.pad{visibility:hidden;}
  .cal-grid .day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-deep);font-weight:800;}
  .cal-grid .day.shot{background:var(--accent);color:#fff;font-weight:800;}

  /* ---- injection site ---- */
  .site-wrap{display:flex;gap:14px;align-items:flex-start;}
  .site-fig{flex:none;width:44%;max-width:170px;}
  .site-fig svg{width:100%;display:block;}
  .site-side{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .cd-block{text-align:right;}
  .cd-block .t{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .cd-block .n{font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--accent-deep);line-height:1.15;}
  .cd-block .n small{font-size:14px;color:var(--ink);font-weight:700;margin-left:4px;font-family:var(--font-body);}
  .cd-block.overdue .n{color:var(--warn);}
  .last-chip{background:var(--surface-2);border-radius:16px;padding:10px 12px;}
  .last-chip .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .last-chip .row1 b{font-family:var(--font-display);font-size:17px;color:var(--accent-deep);font-weight:900;}
  .last-chip .row2{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:15px;font-weight:700;}
  .site-key{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .site-key .item{display:flex;align-items:center;gap:8px;}
  .site-key .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .dot.used1{background:var(--accent-deep);}
  .dot.used2{background:var(--accent);opacity:.5;}
  .dot.next{border:1.6px dashed var(--accent-deep);background:transparent;}
  .dot.free{border:1.6px solid var(--ink-faint);background:transparent;}

  .banner{
    background:var(--accent-soft);color:var(--ink);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.5;
    display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .banner button{background:var(--surface);border:none;color:var(--accent-deep);font-weight:800;font-size:13px;cursor:pointer;flex:none;border-radius:99px;padding:8px 12px;}

  /* ---- forms ---- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:14px;color:var(--ink-soft);font-weight:700;}
  .field input, .field select{
    font-family:var(--font-body);font-size:17px;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;
    padding:0 14px;height:52px;width:100%;-webkit-appearance:none;appearance:none;
  }
  .field select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 15px) 23px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);background-color:var(--surface);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;min-width:0;}
  .field textarea{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;line-height:1.5;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;width:100%;resize:vertical;min-height:90px;}

  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .toggle .t-label{font-size:16px;font-weight:700;}
  .toggle .t-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .switch{width:50px;height:30px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;}
  .switch.on{background:var(--accent);border-color:var(--accent);}
  .switch i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s ease;}
  .switch.on i{left:22px;}

  /* ---- floating bottom nav ---- */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;}
  nav.bottom .bar{
    pointer-events:auto;width:100%;max-width:440px;display:flex;padding:8px 6px;
    background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:30px;box-shadow:0 10px 30px -10px rgba(90,45,35,.28),0 0 0 1px var(--line);
  }
  nav.bottom button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-soft);cursor:pointer;padding:8px 0 6px;position:relative;}
  nav.bottom button svg{width:26px;height:26px;}
  nav.bottom button.active{color:var(--accent-deep);}
  nav.bottom button.active::before{content:'';position:absolute;top:0;width:5px;height:5px;border-radius:50%;background:var(--accent-deep);}
  nav.bottom button span{font-size:14px;font-weight:700;}

  /* ---- bottom sheet ---- */
  .sheet-overlay{position:fixed;inset:0;background:rgba(40,20,15,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .2s ease;max-height:88dvh;overflow-y:auto;}
  .sheet::before{content:'';display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px;}
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h3{margin:0;font-size:20px;font-weight:800;}

  /* ---------- tiny state / persistence (per-device localStorage) ---------- */
  var mem = {

  function seedDemoData(){

  function readLocalStorage(){

  async function initPersistence(){

    var saved = persistMode==='local' ? readLocalStorage() : null;

  /* ---------- InBody CSV / Excel bulk import ---------- */
  function normalizeHeader(h){
    return String(h==null?'':h).toLowerCase().replace(/[\s_\-()]/g,'');
  }
  function pickColumn(headers, patterns, exclude){
    for (var i=0;i<headers.length;i++){
      var nh = normalizeHeader(headers[i]);
      if (exclude && exclude.some(function(x){ return nh.indexOf(x)!==-1; })) continue;
      for (var j=0;j<patterns.length;j++){ if (nh.indexOf(patterns[j])!==-1) return i; }
    }
    return -1;
  }
  function pad2(n){ n = String(n); return n.length<2 ? '0'+n : n; }
  function toISODateAny(v){
    if (v==null || v==='') return null;
    if (v instanceof Date && !isNaN(v.getTime())) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
    var s = String(v).trim();
    // compact YYYYMMDD or YYYYMMDDHHMMSS (InBody's own native export format)
    var cm = s.match(/^(\d{4})(\d{2})(\d{2})(\d{6})?$/);
    if (cm){
      var yy=+cm[1], mo=+cm[2], da=+cm[3];
      if (yy>=1900 && yy<=2100 && mo>=1 && mo<=12 && da>=1 && da<=31) return cm[1]+'-'+pad2(mo)+'-'+pad2(da);
    }
    if (typeof v === 'number' && isFinite(v) && v>0 && v<100000){
      try{
        var dc = window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code(v);
        if (dc && dc.y) return dc.y+'-'+pad2(dc.m)+'-'+pad2(dc.d);
      }catch(e){}
    }
    var m = s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
    if (m) return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
    m = s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})/);
    if (m) return m[3]+'-'+pad2(m[1])+'-'+pad2(m[2]);
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    return null;
  }
  function toNum(v){
    if (v==null || v==='') return null;
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? null : n;
  }

  function parseInBodyFile(file){
    return new Promise(function(resolve, reject){
      var isCsv = /\.csv$/i.test(file.name);
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        try{
          var wb = isCsv ?
            XLSX.read(String(reader.result), {type:'string'}) :
            XLSX.read(reader.result, {type:'array', cellDates:true});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var grid = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
          if (!grid.length){ resolve({rows:[], unmatched:true}); return; }
          var headers = grid[0].map(function(h){ return h==null?'':String(h); });
          var idx = {
            date: pickColumn(headers, ['testdate','date','時間','日期','測試日期','檢測日期','量測日期']),
            weight: pickColumn(headers, ['weight(kg)','weight','體重']),
            fatPercent: pickColumn(headers, ['pbf','bodyfatpercentage','bodyfat%','體脂率','脂肪率','體脂百分比']),
            fatKg: pickColumn(headers, ['bfm','fatmass','bodyfatmass','體脂肪','體脂重']),
            muscleKg: pickColumn(headers, ['smm','skeletalmuscle','骨骼肌','肌肉量']),
            visceralFat: pickColumn(headers, ['內臟脂肪等級','visceralfatlevel','vfl','內臟脂肪'], ['面積','area','cm2','cm²']),
            score: pickColumn(headers, ['inbodyscore','score','inbody分數','inbody評分','評分'])
          };
          if (idx.date===-1 || idx.weight===-1){ resolve({rows:[], unmatched:true}); return; }
          var rows = [];
          for (var r=1; r<grid.length; r++){
            var row = grid[r];
            if (!row) continue;
            var date = toISODateAny(row[idx.date]);
            var weightKg = toNum(row[idx.weight]);
            if (!date || weightKg==null) continue;
            rows.push({
              date: date,
              weightKg: weightKg,
              fatPercent: idx.fatPercent>-1 ? toNum(row[idx.fatPercent]) : null,
              fatKg: idx.fatKg>-1 ? toNum(row[idx.fatKg]) : null,
              muscleKg: idx.muscleKg>-1 ? toNum(row[idx.muscleKg]) : null,
              visceralFat: idx.visceralFat>-1 ? toNum(row[idx.visceralFat]) : null,
              score: idx.score>-1 ? toNum(row[idx.score]) : null
            });
          }
          resolve({rows:rows, unmatched:false});
        }catch(e){ reject(e); }
      };
      if (isCsv) reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
    });
  }

  async function importInBodyRows(rows){
    rows.forEach(function(rec){
      var existing = mem.weights.find(function(w){ return w.date===rec.date; });
      if (existing){
        existing.weightKg = rec.weightKg;
        if (rec.fatPercent!=null) existing.fatPercent = rec.fatPercent;
        if (rec.fatKg!=null) existing.fatKg = rec.fatKg;
        if (rec.muscleKg!=null) existing.muscleKg = rec.muscleKg;
        if (rec.visceralFat!=null) existing.visceralFat = rec.visceralFat;
        if (rec.score!=null) existing.score = rec.score;
      } else {
        rec.id = uuid();
        mem.weights.push(rec);
      }
    });
    sortData();
    writeLocalStorage();
  }

  /* ---------- helpers ---------- */
  function fmtKg(n){ return (Math.round(n*10)/10).toFixed(1); }
  // Doses need two decimals (0.25 mg must not show as 0.3); trailing zeros dropped.
  function fmtDose(n){ return String(Math.round(n*1000)/1000); }
  function fmtMD(iso){ var p=iso.split('-'); return p[1]+'/'+p[2]; }
  function fmtYMD(iso){ var p=iso.split('-'); return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'; }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function latestWeight(){
    return mem.weights.length ? mem.weights[mem.weights.length-1] : null;
  }
  function latestInjection(){
    return mem.injections.length ? mem.injections[mem.injections.length-1] : null;
  }
  function currentBMI(){
    var lw = latestWeight();
    var kg = lw ? lw.weightKg : mem.profile.startWeight;

  function recentSites(n){
    var arr = mem.injections.slice(-n).reverse();
    return arr.map(function(r){ return r.site; });
  }
  function recommendedSite(){
    var used = recentSites(3);
    for (var i=0;i<SITES.length;i++){
      if (used.indexOf(SITES[i].id) === -1) return SITES[i].id;
    }
    return SITES[0].id;
  }

  /* ---------- chart ---------- */
  var chartSeq = 0;
  function lineChart(points, opts){
    opts = opts || {};
    var W = 340, H = opts.height || 190, padL=40, padR=14, padT=50, padB=26;
    if (!points.length){
      return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-size="13">'+esc(L('chart_empty'))+'</text></svg>';
    }
    var gid = 'fillg' + (++chartSeq);
    var xs = points.map(function(p){ return new Date(p.date).getTime(); });
    var ys = points.map(function(p){ return p.value; });
    if (opts.goal!=null) ys = ys.concat([opts.goal]);
    var xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
    var yMin=Math.min.apply(null,ys), yMax=Math.max.apply(null,ys);
    if (xMin===xMax){ xMin -= 86400000; xMax += 86400000; }
    if (yMin===yMax){ yMin -= 1; yMax += 1; }
    var pad = (yMax-yMin)*0.08;
    yMin -= pad; yMax += pad;
    function X(x){ return padL + (x-xMin)/(xMax-xMin) * (W-padL-padR); }
    function Y(y){ return H-padB - (y-yMin)/(yMax-yMin) * (H-padT-padB); }

    var d = points.map(function(p,i){
      return (i===0?'M':'L') + X(new Date(p.date).getTime()).toFixed(1) + ' ' + Y(p.value).toFixed(1);
    }).join(' ');
    var area = d + ' L' + X(xs[xs.length-1]).toFixed(1) + ' ' + (H-padB) + ' L' + X(xs[0]).toFixed(1) + ' ' + (H-padB) + ' Z';

    var grid = '';
    [yMax, (yMin+yMax)/2, yMin].forEach(function(gy, i){
      grid += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(gy).toFixed(1)+'" y2="'+Y(gy).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="'+(padL-6)+'" y="'+(Y(gy)+4).toFixed(1)+'" text-anchor="end" font-size="12">'+Math.round(gy)+(i===0?'':'')+'</text>';
    });

    var goalLine = '';
    if (opts.goal!=null){
      goalLine = '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(opts.goal).toFixed(1)+'" y2="'+Y(opts.goal).toFixed(1)+'" stroke="var(--sage)" stroke-width="1.5" stroke-dasharray="4 4"/>';
    }

    var last = points[points.length-1];
    var lx = X(xs[xs.length-1]), ly = Y(last.value);
    var tipText = fmtMD(last.date) + ' · ' + fmtKg(last.value) + ' kg';
    var tipW = 7.4*tipText.length + 22, tipH = 30;
    var tipX = Math.min(W - padR - tipW, Math.max(padL, lx - tipW/2)), tipY = 6;
    var tip = '<line x1="'+lx.toFixed(1)+'" x2="'+lx.toFixed(1)+'" y1="'+(tipY+tipH)+'" y2="'+(H-padB)+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7"/>' +
      '<rect class="tip-bg" x="'+tipX.toFixed(1)+'" y="'+tipY+'" width="'+tipW.toFixed(1)+'" height="'+tipH+'" rx="9"/>' +
      '<text class="tip-tx" x="'+(tipX+tipW/2).toFixed(1)+'" y="'+(tipY+20)+'" text-anchor="middle" font-size="13">'+esc(tipText)+'</text>';

    var xLabels = '<text x="'+padL+'" y="'+(H-6)+'" font-size="12">'+fmtMD(points[0].date)+'</text>' +
      '<text x="'+(W-padR)+'" y="'+(H-6)+'" text-anchor="end" font-size="12">'+fmtMD(last.date)+'</text>';

    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+esc(tipText)+'">' +
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.22"/>' +
        '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      grid + goalLine +
      '<path d="'+area+'" fill="url(#'+gid+')"/>' +
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      tip +
      '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.6"/>' +
      xLabels +
      '</svg>';
  }

  var weightRange = '3m';
  function filteredWeights(){
    if (weightRange==='all' || !mem.weights.length) return mem.weights;
    var days = weightRange==='1m'?30:weightRange==='3m'?90:180;
    var cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
    var cutIso = cutoff.toISOString().slice(0,10);
    return mem.weights.filter(function(w){ return w.date>=cutIso; });
  }

        confirmInline(msg, L('msg_inbodyDetected', {n:res.rows.length, from:dates[0], to:dates[dates.length-1]}), L('msg_inbodyImportBtn'), function(){
          importInBodyRows(res.rows).then(function(){
            msg.style.color = 'var(--teal)';
            msg.textContent = L('msg_inbodyImported', {n:res.rows.length});
            refreshAll(); renderSettings();
          });
        });
      }).catch(function(){
        msg.style.color = 'var(--warn)';
        msg.textContent = L('msg_inbodyBadFile');
      });
    };
    document.getElementById('clearBtn').onclick = function(){
      var msg = document.getElementById('clearMsg');
      confirmInline(msg, L('msg_confirmClear'), L('msg_confirmClearBtn'), function(){
        clearAllData().then(function(){
          msg.style.color='var(--teal)'; msg.textContent=L('msg_cleared');
          refreshAll();
        });
      });
    };
  }

  /* ---------- forms (bottom sheet) ---------- */
  var overlay = document.getElementById('sheetOverlay');
  var sheetBody = document.getElementById('sheetBody');
  function closeSheet(){ overlay.classList.remove('open'); }
  overlay.addEventListener('click', function(e){ if (e.target===overlay) closeSheet(); });

  function openWeightForm(){
    var aiAvailable = !!(sampleCap && sampleImgLimits && sampleImgLimits.images);
    sheetBody.innerHTML =
      '<div class="sheet-head"><h3>'+esc(L('wf_title'))+'</h3><button id="closeSheet">✕</button></div>' +
      (aiAvailable ?
        '<input type="file" id="wf-ai-input" accept="'+esc((sampleImgLimits.images.mediaTypes||['image/*']).join(','))+'" hidden>' +
        '<button class="btn ghost block" id="wf-ai-btn" type="button">' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.5"/></svg> ' +
          esc(L('wf_aiImportBtn')) +
        '</button>' +
        '<div class="note" id="wf-ai-msg" style="margin:8px 0 4px;min-height:14px"></div>'
      : '') +
      '<div class="field"><label>'+esc(L('wf_date'))+'</label><input type="date" id="wf-date" value="'+todayISO+'"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>'+esc(L('wf_weight'))+'</label><input type="number" inputmode="decimal" id="wf-weight" step="0.1" placeholder="'+esc(L('wf_weightPh'))+'"></div>' +
        '<div class="field"><label>'+esc(L('wf_fatPercent'))+'</label><input type="number" inputmode="decimal" id="wf-fatpct" step="0.1"></div>' +
      '</div>' +
      '<button class="btn ghost small" id="wf-inbody-toggle" type="button" style="margin-bottom:12px">'+esc(L('wf_inbodyToggle'))+' ▾</button>' +
      '<div id="wf-inbody-fields" hidden>' +
        '<div class="field-row">' +
          '<div class="field"><label>'+esc(L('wf_fat'))+'</label><input type="number" inputmode="decimal" id="wf-fat" step="0.1"></div>' +
          '<div class="field"><label>'+esc(L('wf_muscle'))+'</label><input type="number" inputmode="decimal" id="wf-muscle" step="0.1"></div>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label>'+esc(L('wf_visceralFat'))+'</label><input type="number" inputmode="numeric" id="wf-visceral" step="1"></div>' +
          '<div class="field"><label>'+esc(L('wf_score'))+'</label><input type="number" inputmode="numeric" id="wf-score" step="1"></div>' +
        '</div>' +
      '</div>' +
      '<button class="btn primary block" id="wf-save">'+esc(L('wf_save'))+'</button>';
    overlay.classList.add('open');
    document.getElementById('closeSheet').onclick = closeSheet;

    document.getElementById('wf-inbody-toggle').onclick = function(){
      var box = document.getElementById('wf-inbody-fields');
      box.hidden = !box.hidden;
    };

    function fillFromExtract(obj){
      if (obj.date) document.getElementById('wf-date').value = obj.date;
      if (obj.weightKg!=null) document.getElementById('wf-weight').value = obj.weightKg;
      if (obj.fatPercent!=null) document.getElementById('wf-fatpct').value = obj.fatPercent;
      if (obj.fatKg!=null) document.getElementById('wf-fat').value = obj.fatKg;
      if (obj.muscleKg!=null) document.getElementById('wf-muscle').value = obj.muscleKg;
      if (obj.visceralFat!=null) document.getElementById('wf-visceral').value = obj.visceralFat;
      if (obj.score!=null) document.getElementById('wf-score').value = obj.score;
      if (obj.fatKg!=null || obj.muscleKg!=null || obj.visceralFat!=null || obj.score!=null){
        document.getElementById('wf-inbody-fields').hidden = false;
      }
    }

    if (aiAvailable){
      var aiBtn = document.getElementById('wf-ai-btn');
      var aiMsg = document.getElementById('wf-ai-msg');
      aiBtn.onclick = function(){ document.getElementById('wf-ai-input').click(); };
      document.getElementById('wf-ai-input').onchange = function(e){
        var f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        aiBtn.disabled = true;
        aiMsg.style.color = 'var(--ink-faint)';
        aiMsg.textContent = L('wf_aiRecognizing');
        var prompt = 'This is a photo of an InBody body-composition scale report. Read the printed values and reply with ONLY this JSON object (no other text), using null for any field not visible on the report:\n' +
          '{"date": "YYYY-MM-DD or null", "weightKg": number or null, "fatPercent": number or null (body fat %, PBF), "fatKg": number or null (body fat mass), "muscleKg": number or null (skeletal muscle mass, SMM), "visceralFat": number or null (visceral fat level), "score": number or null (InBody score)}';
        sampleCap.json(prompt, {images:f, modelTier:'default', cache:false}).then(function(obj){
          fillFromExtract(obj||{});
          var gotAny = obj && (obj.weightKg!=null || obj.fatPercent!=null || obj.fatKg!=null || obj.muscleKg!=null);
          aiMsg.style.color = gotAny ? 'var(--teal)' : 'var(--warn)';
          aiMsg.textContent = gotAny ? L('wf_aiFilled') : L('wf_aiEmpty');
        }).catch(function(err){
          var code = err && err.code;
          if (code==='not_granted' || code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed' || code==='images_unavailable'){
            aiBtn.style.display = 'none';
            aiMsg.textContent = '';
            return;
          }
          aiMsg.style.color = 'var(--warn)';
          if (code==='image_rejected') aiMsg.textContent = L('wf_aiImageRejected');
          else if (code==='rate_limited') aiMsg.textContent = L('wf_aiRateLimited');
          else if (code==='cancelled') aiMsg.textContent = '';
          else aiMsg.textContent = L('wf_aiUpstream');
        }).finally(function(){ aiBtn.disabled = false; });
      };
    }

    document.getElementById('wf-save').onclick = function(){
      var v = +document.getElementById('wf-weight').value;
      if (!v){ document.getElementById('wf-weight').focus(); return; }
      function numOrNull(id){ var el = document.getElementById(id); return el.value ? +el.value : null; }
      var rec = {
        date: document.getElementById('wf-date').value || todayISO,
        weightKg: v,
        fatPercent: numOrNull('wf-fatpct'),
        fatKg: numOrNull('wf-fat'),
        muscleKg: numOrNull('wf-muscle'),
        visceralFat: numOrNull('wf-visceral'),
        score: numOrNull('wf-score')
      };
      addWeight(rec).then(function(){
        closeSheet(); renderHome(); renderWeight(); updateDayBadge();
      });
    };
  }

  function openInjectionForm(){
    var rec = recommendedSite();
    sheetBody.innerHTML =
      '<div class="sheet-head"><h3>'+esc(L('sf_title'))+'</h3><button id="closeSheet">✕</button></div>' +
      '<div class="field"><label>'+esc(L('sf_date'))+'</label><input type="date" id="sf-date" value="'+todayISO+'"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>'+esc(L('sf_dose'))+'</label><input type="number" inputmode="decimal" id="sf-dose" step="0.05" placeholder="'+esc(L('sf_dosePh'))+'"></div>' +
        '<div class="field"><label>'+esc(L('sf_site'))+'</label><select id="sf-site">' +
          SITES.map(function(s){ return '<option value="'+s.id+'"'+(s.id===rec?' selected':'')+'>'+esc(siteLabel(s.id))+(s.id===rec?esc(L('sf_recommended')):'')+'</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<button class="btn primary block" id="sf-save">'+esc(L('sf_save'))+'</button>';
    overlay.classList.add('open');
    document.getElementById('closeSheet').onclick = closeSheet;
    document.getElementById('sf-save').onclick = function(){
      var dose = +document.getElementById('sf-dose').value;
      if (!dose){ document.getElementById('sf-dose').focus(); return; }
      var r = {
        date: document.getElementById('sf-date').value || todayISO,
        doseMg: dose,
        site: document.getElementById('sf-site').value
      };
      addInjection(r).then(function(){
        closeSheet(); renderHome(); renderShot(); setTitle(currentView);
      });
    };
  }

  /* ---------- AI analysis (Gemini, free web app — no API key stored in the page) ---------- */
  function buildSummaryText(){
    var p = mem.profile;
    var genderText = p.gender==='female'?L('gender_female'):p.gender==='male'?L('gender_male'):L('gender_other');
    var lines = [];
    lines.push(L('ai_intro'));
    lines.push('');
    lines.push(L('ai_basicHeader'));
    lines.push(L('ai_genderHeight',{gender:genderText, h:p.heightCm}));
    lines.push(L('ai_startGoal',{start:fmtKg(p.startWeight), goal:fmtKg(p.goalWeight)}));
    lines.push(L('ai_medCycle',{med:p.medication, days:p.intervalDays}));
    lines.push('');
    lines.push(L('ai_weightHeader'));
    if (mem.weights.length){
      mem.weights.slice().reverse().forEach(function(w){
        lines.push(w.date + '  ' + fmtKg(w.weightKg) + '  ' + (w.fatPercent!=null?fmtKg(w.fatPercent):'-') + '  ' + (w.fatKg!=null?fmtKg(w.fatKg):'-') + '  ' + (w.muscleKg!=null?fmtKg(w.muscleKg):'-') + '  ' + (w.visceralFat!=null?w.visceralFat:'-') + '  ' + (w.score!=null?w.score:'-'));
      });
    } else { lines.push(L('ai_noRecords')); }
    lines.push('');
    lines.push(L('ai_shotHeader'));
    if (mem.injections.length){
      mem.injections.slice().reverse().forEach(function(r){
        lines.push(r.date + '  ' + fmtDose(r.doseMg) + 'mg  ' + siteLabel(r.site));
      });
    } else { lines.push(L('ai_noRecords')); }
    return lines.join('\n');
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  function copyToClipboard(text){
    return new Promise(function(resolve){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ resolve(true); }).catch(function(){ resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function openAISheet(){
    var text = buildSummaryText();
    sheetBody.innerHTML =
      '<div class="sheet-head"><h3>'+esc(L('ai_title'))+'</h3><button id="closeSheet">✕</button></div>' +
      '<div class="note" style="margin-bottom:10px">'+esc(L('ai_note'))+'</div>' +
      '<div class="ai-preview">'+esc(text)+'</div>' +
      '<div class="action-row" style="margin-top:12px">' +
        '<button class="btn ghost" id="aiCopyBtn">'+esc(L('ai_copyBtn'))+'</button>' +
        '<a class="btn primary" id="aiOpenBtn" href="https://gemini.google.com/app" target="_blank" rel="noopener">'+esc(L('ai_openBtn'))+'</a>' +
      '</div>';
    overlay.classList.add('open');
    document.getElementById('closeSheet').onclick = closeSheet;
    document.getElementById('aiCopyBtn').onclick = function(){
      var btn = this;
      copyToClipboard(text).then(function(ok){
        btn.textContent = ok ? L('msg_copied') : L('msg_copyFailedManual');
        setTimeout(function(){ btn.textContent = L('ai_copyBtn'); }, 1800);
      });
    };
  }

  /* ---------- nav / boot ---------- */
  function setTitle(name){
    var sub = '';
    if (name==='shot') sub = mem.injections.length + (L('shot_unitTimes') ? ' '+L('shot_unitTimes') : '');
    document.getElementById('viewTitle').innerHTML = esc(L('title_'+name)) + (sub ? '<small>'+esc(sub)+'</small>' : '');
  }
  function switchView(name){
    currentView = name;
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.getAttribute('data-view')===name); });
    document.querySelectorAll('nav.bottom button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===name); });
    setTitle(name);
    if (name==='home') renderHome();
    if (name==='weight') renderWeight();
    if (name==='shot') renderShot();
    if (name==='settings') renderSettings();
  }
  document.getElementById('aiPill').onclick = function(){ openAISheet(); };
  document.getElementById('navBar').addEventListener('click', function(e){
    var b = e.target.closest('[data-nav]');
    if (b) switchView(b.getAttribute('data-nav'));
  });

  function updateNavLabels(){
    document.getElementById('navLabelHome').textContent = L('nav_home');
    document.getElementById('navLabelWeight').textContent = L('nav_weight');
    document.getElementById('navLabelShot').textContent = L('nav_shot');
    document.getElementById('navLabelSettings').textContent = L('nav_settings');
  }

  function updateDayBadge(){
    var streak = mem.weights.length ? Math.max(1, daysBetween(mem.weights[0].date, todayISO)) : 1;
    document.getElementById('dayBadge').textContent = L('dayBadge', {n:streak});
  }

  initPersistence().then(function(){
    LANG = (mem.profile && mem.profile.lang) || 'zh';
    updateNavLabels();
    updateDayBadge();
    switchView('home');
  });
})();
</script>
