<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>針藥誌</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F4F7F5;
    --surface:#FFFFFF;
    --surface-2:#EDF2EF;
    --ink:#122A25;
    --ink-soft:#5A7169;
    --ink-faint:#8CA098;
    --line:#DCE6E1;
    --accent:#B4642A;      /* apothecary amber - injections */
    --accent-soft:#F2E2D2;
    --teal:#2E7C69;        /* progress / weight-down */
    --teal-soft:#DEEEE7;
    --warn:#C0432E;
    --warn-soft:#F6DFD9;
    --shadow: 0 1px 2px rgba(18,42,37,.06), 0 8px 24px -12px rgba(18,42,37,.18);
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1714;
      --surface:#16221D;
      --surface-2:#1C2B24;
      --ink:#EAF2EE;
      --ink-soft:#9FB6AC;
      --ink-faint:#6C8279;
      --line:#25352D;
      --accent:#E0965B;
      --accent-soft:#3A2C1E;
      --teal:#5CBB9E;
      --teal-soft:#1B3129;
      --warn:#E27D68;
      --warn-soft:#3A2320;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1714;
    --surface:#16221D;
    --surface-2:#1C2B24;
    --ink:#EAF2EE;
    --ink-soft:#9FB6AC;
    --ink-faint:#6C8279;
    --line:#25352D;
    --accent:#E0965B;
    --accent-soft:#3A2C1E;
    --teal:#5CBB9E;
    --teal-soft:#1B3129;
    --warn:#E27D68;
    --warn-soft:#3A2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    padding:14px 18px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    letter-spacing:.01em;
  }
  header.top .brand small{
    font-family:var(--font-body);
    font-weight:500;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:8px;
  }
  header.top .day-badge{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:99px;
    padding:4px 10px;
  }
  main{
    flex:1;
    padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  section.view{display:none;flex-direction:column;gap:14px;}
  section.view.active{display:flex;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .card h2{
    margin:0 0 10px;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:.03em;
    text-transform:uppercase;
  }

  .hero{
    background:linear-gradient(155deg, var(--teal) 0%, #1F5F50 100%);
    color:#F4FBF8;
    border-radius:20px;
    padding:20px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .hero .eyebrow{font-size:12px;opacity:.85;font-weight:500;}
  .hero .big{
    font-family:var(--font-display);
    font-size:44px;
    font-weight:600;
    line-height:1.1;
    margin:4px 0 2px;
    text-wrap:balance;
    font-variant-numeric:tabular-nums;
  }
  .hero .big span{font-size:20px;font-weight:500;opacity:.85;margin-left:4px;}
  .hero .sub{font-size:13px;opacity:.9;margin-bottom:14px;}
  .hero .bar{
    height:8px;border-radius:99px;background:rgba(255,255,255,.22);
    overflow:hidden;margin-bottom:6px;
  }
  .hero .bar > i{display:block;height:100%;background:#FFF;border-radius:99px;}
  .hero .bar-labels{
    display:flex;justify-content:space-between;
    font-family:var(--font-mono);font-size:11px;opacity:.85;
  }
  .hero .countdown{
    margin-top:16px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    border-radius:14px;
    padding:10px 12px;
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;
  }
  .hero .countdown.overdue{background:rgba(224,125,104,.35);border-color:rgba(224,125,104,.6);}
  .hero .countdown .cd-num{font-family:var(--font-display);font-size:22px;font-weight:600;}
  .hero .countdown .cd-label{font-size:11px;opacity:.85;}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 10px;text-align:left;
  }
  .stat-tile .label{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .stat-tile .value{font-family:var(--font-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stat-tile .value.accent{color:var(--accent);}
  .stat-tile .value.teal{color:var(--teal);}

  .action-row{display:flex;gap:10px;}
  .btn{
    font-family:var(--font-body);
    font-weight:600;font-size:14px;
    border-radius:13px;padding:12px 14px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    flex:1;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.teal{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;flex:none;}
  .btn.danger{color:var(--warn);border-color:var(--warn-soft);}
  a.btn{text-decoration:none;}

  .ai-promo{display:flex;gap:12px;align-items:center;cursor:pointer;}
  .ai-promo .icon{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:var(--teal-soft);color:var(--teal);
    display:flex;align-items:center;justify-content:center;
  }
  .ai-promo .txt b{display:block;font-size:14px;}
  .ai-promo .txt span{font-size:12px;color:var(--ink-soft);}
  .ai-preview{
    font-family:var(--font-mono);font-size:11px;line-height:1.65;white-space:pre-wrap;
    background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;
    max-height:220px;overflow-y:auto;color:var(--ink-soft);
  }

  .seg{
    display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;
  }
  .seg button{
    flex:1;border:none;background:transparent;color:var(--ink-soft);
    font-family:var(--font-body);font-size:12.5px;font-weight:600;
    padding:8px 4px;border-radius:9px;cursor:pointer;
  }
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  svg.chart{width:100%;height:auto;display:block;}
  svg.chart text{font-family:var(--font-mono);fill:var(--ink-soft);}
  .chart-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;}
  .chart-legend span{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
  .chart-legend i{width:10px;height:3px;border-radius:2px;display:inline-block;}

  .summary-grid{display:flex;gap:16px;align-items:center;}
  .summary-grid .ring-wrap{position:relative;width:104px;height:104px;flex:none;}
  .summary-grid .ring-wrap .ring-val{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .summary-grid .ring-wrap .ring-val b{font-family:var(--font-display);font-size:19px;}
  .summary-grid .ring-wrap .ring-val small{font-size:10px;color:var(--ink-soft);}
  .kv-list{flex:1;display:flex;flex-direction:column;gap:8px;}
  .kv-row{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:8px;}
  .kv-row:last-child{border:none;padding-bottom:0;}
  .kv-row .k{color:var(--ink-soft);}
  .kv-row .v{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;}

  table.rec{width:100%;border-collapse:collapse;font-size:13px;}
  table.rec th{
    text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;
    padding:0 6px 8px;text-transform:uppercase;letter-spacing:.02em;
  }
  table.rec td{padding:10px 6px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;}
  table.rec td.num{font-family:var(--font-mono);}
  table.rec tr td:first-child, table.rec tr th:first-child{padding-left:2px;}
  .row-actions{display:flex;justify-content:flex-end;}
  .icon-btn{
    background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;border-radius:8px;
  }
  .icon-btn:hover{color:var(--warn);background:var(--warn-soft);}
  .empty-row td{color:var(--ink-faint);text-align:center;padding:18px 6px;}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .m-label{font-weight:600;font-size:14.5px;font-family:var(--font-display);}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-grid .dow{font-size:10.5px;color:var(--ink-faint);padding-bottom:4px;}
  .cal-grid .day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:12.5px;position:relative;color:var(--ink);
  }
  .cal-grid .day.pad{visibility:hidden;}
  .cal-grid .day.today{border:1px solid var(--teal);}
  .cal-grid .day.shot{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .cal-grid .day.shot::after{
    content:'';position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--accent);
  }

  .site-wrap{display:flex;gap:14px;align-items:flex-start;}
  .site-fig{flex:none;width:126px;}
  .site-fig svg{width:100%;}
  .site-key{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;}
  .site-key .item{display:flex;align-items:center;gap:7px;}
  .site-key .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .site-key .dot.used1{background:var(--accent);}
  .site-key .dot.used2{background:var(--accent);opacity:.55;}
  .site-key .dot.next{border:1.5px dashed var(--teal);background:transparent;}
  .site-key .dot.free{border:1.5px solid var(--line);background:transparent;}

  .banner{
    background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);
    border-radius:14px;padding:11px 14px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;
  }
  .banner button{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;flex:none;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{
    font-family:var(--font-body);font-size:14.5px;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;width:100%;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .field textarea{
    font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;width:100%;resize:vertical;min-height:80px;
  }
  .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn.small.danger{background:var(--warn);border-color:var(--warn);color:#fff;}

  .toggle{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 2px;border-top:1px solid var(--line);
  }
  .toggle:first-child{border-top:none;}
  .toggle .t-label{font-size:14px;}
  .toggle .t-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .switch{
    width:42px;height:25px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);
    position:relative;cursor:pointer;flex:none;
  }
  .switch.on{background:var(--teal);border-color:var(--teal);}
  .switch i{
    position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;
    box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s ease;
  }
  .switch.on i{left:19px;}

  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom,0px);
    z-index:30;
    pointer-events:none;
  }
  nav.bottom .bar{
    pointer-events:auto;
    width:100%;max-width:460px;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px 10px;
  }
  nav.bottom button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-faint);cursor:pointer;padding:4px 0;font-family:var(--font-body);
  }
  nav.bottom button.active{color:var(--teal);}
  nav.bottom button span{font-size:10.5px;font-weight:600;}

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:460px;background:var(--surface);border-radius:20px 20px 0 0;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
    transform:translateY(16px);transition:transform .18s ease;
    max-height:86dvh;overflow-y:auto;
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;}
  .sheet-head button{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;}

  .note{font-size:11.5px;color:var(--ink-faint);line-height:1.5;}
  a.plain{color:var(--teal);}

  @media (max-width:380px){
    .hero .big{font-size:36px;}
    .stat-tile .value{font-size:15px;}
  }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand" id="viewTitle">首頁<small id="viewSub"></small></div>
    <div class="day-badge" id="dayBadge">第 1 天</div>
  </header>

  <main id="main">
    <!-- HOME -->
    <section class="view active" data-view="home" id="view-home"></section>
    <!-- WEIGHT -->
    <section class="view" data-view="weight" id="view-weight"></section>
    <!-- INJECTION -->
    <section class="view" data-view="shot" id="view-shot"></section>
    <!-- SETTINGS -->
    <section class="view" data-view="settings" id="view-settings"></section>
  </main>

  <nav class="bottom">
    <div class="bar" id="navBar">
      <button data-nav="home" class="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span id="navLabelHome">首頁</span>
      </button>
      <button data-nav="weight">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17 9 9l4 4 8-9"/></svg>
        <span id="navLabelWeight">體重</span>
      </button>
      <button data-nav="shot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m18 2 4 4-3 3-2-2-8 8 2 2-2 2-2-2-2 2-2-2 2-2-2-2 8-8-2-2Z"/><path d="m14 6 4 4"/></svg>
        <span id="navLabelShot">注射</span>
      </button>
      <button data-nav="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
        <span id="navLabelSettings">設定</span>
      </button>
    </div>
  </nav>

  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet" id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- constants ---------- */
  var SITES = [
    {id:'r-abd-l', x:48, y:72},
    {id:'l-arm',   x:100,y:34},
    {id:'r-arm',   x:26, y:34},
    {id:'l-abd-u', x:78, y:56},
    {id:'r-abd-u', x:48, y:56},
    {id:'l-abd-l', x:78, y:72},
    {id:'l-thigh', x:82, y:108},
    {id:'r-thigh', x:44, y:108}
  ];
  var SITE_LABELS = {
    zh:{'l-arm':'左上臂','r-arm':'右上臂','l-abd-u':'左上腹','r-abd-u':'右上腹','l-abd-l':'左下腹','r-abd-l':'右下腹','l-thigh':'左大腿','r-thigh':'右大腿'},
    en:{'l-arm':'Left upper arm','r-arm':'Right upper arm','l-abd-u':'Left upper abdomen','r-abd-u':'Right upper abdomen','l-abd-l':'Left lower abdomen','r-abd-l':'Right lower abdomen','l-thigh':'Left thigh','r-thigh':'Right thigh'}
  };
  var DOW = { zh:['日','一','二','三','四','五','六'], en:['S','M','T','W','T','F','S'] };
  var MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var todayISO = new Date().toISOString().slice(0,10);

  /* ---------- i18n ---------- */
  var LANG = 'zh';
  var T = {
    zh:{
      nav_home:'首頁', nav_weight:'體重', nav_shot:'注射', nav_settings:'設定',

  };
  function L(key, vars){
    var s = (T[LANG] && T[LANG][key]!=null) ? T[LANG][key] : T.zh[key];
    if (s==null) return key;
    if (vars){ Object.keys(vars).forEach(function(k){ s = s.split('{'+k+'}').join(vars[k]); }); }
    return s;
  }
  function siteLabel(id){
    return (SITE_LABELS[LANG] && SITE_LABELS[LANG][id]) || SITE_LABELS.zh[id] || id;
  }
  function monthLabel(y, m){
    return LANG==='en' ? (MONTHS_EN[m] + ' ' + y) : (y + ' 年 ' + (m+1) + ' 月');
  }

  /* ---------- tiny state / persistence (per-device localStorage) ---------- */
  var mem = {
    profile: null,
    weights: [],
    injections: []
  };
  var LS_KEY = 'zhenyaozhi.records.v1';
  var persistMode = 'memory'; // 'local' | 'memory'
  var downloadsCap = null;
  var sampleCap = null;
  var sampleImgLimits = null;

  function uuid(){ return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function defaultProfile(){
    return {
      gender:'female', heightCm:160, startWeight:90, goalWeight:65,
      medication:'司美格魯肽', intervalDays:7, totalSpend:0,
      remindersOn:false, seeded:true, startDate: todayISO, lang:'zh'
    };
  }

  function seedDemoData(){
    var out = {weights:[], injections:[]};
    var start = new Date(); start.setDate(start.getDate()-56);
    var w = 90;
    for (var i=0;i<8;i++){
      var d = new Date(start); d.setDate(d.getDate() + i*7);
      w = +(w - (1.1 + Math.random()*0.9)).toFixed(1);
      out.weights.push({id:uuid(), date:d.toISOString().slice(0,10), weightKg:w, fatKg:null, muscleKg:null});
      out.injections.push({id:uuid(), date:d.toISOString().slice(0,10), doseMg: i<3?0.25:(i<6?0.5:1.0), site:SITES[i%SITES.length].id});
    }
    return out;
  }

  function readLocalStorage(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (obj && obj.profile && Array.isArray(obj.weights) && Array.isArray(obj.injections)) return obj;
    }catch(e){}
    return null;
  }
  function writeLocalStorage(){
    if (persistMode!=='local') return false;
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({profile:mem.profile, weights:mem.weights, injections:mem.injections}));
      return true;
    }catch(e){ return false; }
  }

  async function initPersistence(){
    try{
      var probe = '__zy_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
      persistMode = 'local';
    }catch(e){ persistMode = 'memory'; }

    var saved = persistMode==='local' ? readLocalStorage() : null;
    if (saved){
      mem.profile = Object.assign(defaultProfile(), saved.profile, {seeded:false});
      mem.weights = saved.weights;
      mem.injections = saved.injections;
    } else {
      var seed = seedDemoData();
      mem.profile = defaultProfile();
      mem.weights = seed.weights;
      mem.injections = seed.injections;
      writeLocalStorage();
    }
    sortData();

    try{
      if (window.claude && window.claude.use) downloadsCap = await window.claude.use('downloads');
    }catch(e){ downloadsCap = null; }

    try{
      if (window.claude && window.claude.use) sampleCap = await window.claude.use('sample');
      if (sampleCap) sampleImgLimits = await sampleCap.limits().catch(function(){ return null; });
    }catch(e){ sampleCap = null; sampleImgLimits = null; }
  }

  function sortData(){
    mem.weights.sort(function(a,b){ return a.date.localeCompare(b.date); });
    mem.injections.sort(function(a,b){ return a.date.localeCompare(b.date); });
  }

  async function saveProfile(patch){
    mem.profile = Object.assign({}, mem.profile, patch);
    writeLocalStorage();
  }
  async function addWeight(rec){
    rec.id = uuid();
    mem.weights.push(rec); sortData();
    writeLocalStorage();
  }
  async function deleteWeight(id){
    mem.weights = mem.weights.filter(function(r){ return r.id!==id; });
    writeLocalStorage();
  }
  async function addInjection(rec){
    rec.id = uuid();
    mem.injections.push(rec); sortData();
    writeLocalStorage();
  }
  async function deleteInjection(id){
    mem.injections = mem.injections.filter(function(r){ return r.id!==id; });
    writeLocalStorage();
  }
  async function clearAllData(){
    mem.weights = []; mem.injections = [];
    writeLocalStorage();
  }
  async function restoreFromBackup(obj){
    mem.profile = Object.assign(defaultProfile(), mem.profile, obj.profile||{}, {seeded:false});
    mem.weights = obj.weights.map(function(w){ return Object.assign({}, w, {id:w.id||uuid()}); });
    mem.injections = obj.injections.map(function(r){ return Object.assign({}, r, {id:r.id||uuid()}); });
    sortData();
    writeLocalStorage();
  }

  /* ---------- backup / restore (export file or text, re-import) ---------- */
  function buildBackupObject(){
    return {app:'zhenyaozhi', version:1, exportedAt:new Date().toISOString(),
      profile:mem.profile, weights:mem.weights, injections:mem.injections};
  }
  function backupJSONText(){ return JSON.stringify(buildBackupObject(), null, 2); }
  function parseBackupText(text){
    try{
      var obj = JSON.parse(text);
      if (obj && typeof obj==='object' && Array.isArray(obj.weights) && Array.isArray(obj.injections)) return obj;
    }catch(e){}
    return null;
  }
  async function exportBackupFile(){
    var text = backupJSONText();
    if (downloadsCap){
      try{
        await downloadsCap.save({filename:'針藥誌備份_'+todayISO+'.json', data:text});
        return {ok:true, mode:'file'};
      }catch(e){ /* fall through to clipboard */ }
    }
    var copied = await copyToClipboard(text);
    return {ok:copied, mode:'clipboard'};
  }
  function confirmInline(msgEl, message, confirmLabel, onConfirm){
    msgEl.innerHTML = esc(message) + ' <button class="btn small danger" id="__confirmBtn" type="button">'+esc(confirmLabel)+'</button>';
    msgEl.style.color = 'var(--warn)';
    document.getElementById('__confirmBtn').onclick = function(){ msgEl.textContent=''; onConfirm(); };
  }

  /* ---------- InBody CSV / Excel bulk import ---------- */
  function normalizeHeader(h){
    return String(h==null?'':h).toLowerCase().replace(/[\s_\-()]/g,'');
  }
  function pickColumn(headers, patterns, exclude){
    for (var i=0;i<headers.length;i++){
      var nh = normalizeHeader(headers[i]);
      if (exclude && exclude.some(function(x){ return nh.indexOf(x)!==-1; })) continue;
      for (var j=0;j<patterns.length;j++){ if (nh.indexOf(patterns[j])!==-1) return i; }
    }
    return -1;
  }
  function pad2(n){ n = String(n); return n.length<2 ? '0'+n : n; }
  function toISODateAny(v){
    if (v==null || v==='') return null;
    if (v instanceof Date && !isNaN(v.getTime())) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
    var s = String(v).trim();
    // compact YYYYMMDD or YYYYMMDDHHMMSS (InBody's own native export format)
    var cm = s.match(/^(\d{4})(\d{2})(\d{2})(\d{6})?$/);
    if (cm){
      var yy=+cm[1], mo=+cm[2], da=+cm[3];
      if (yy>=1900 && yy<=2100 && mo>=1 && mo<=12 && da>=1 && da<=31) return cm[1]+'-'+pad2(mo)+'-'+pad2(da);
    }
    if (typeof v === 'number' && isFinite(v) && v>0 && v<100000){
      try{
        var dc = window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code(v);
        if (dc && dc.y) return dc.y+'-'+pad2(dc.m)+'-'+pad2(dc.d);
      }catch(e){}
    }
    var m = s.match(/^(\d{4})[-\/\.](\d{1,2})[-\/\.](\d{1,2})/);
    if (m) return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
    m = s.match(/^(\d{1,2})[-\/\.](\d{1,2})[-\/\.](\d{4})/);
    if (m) return m[3]+'-'+pad2(m[1])+'-'+pad2(m[2]);
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    return null;
  }
  function toNum(v){
    if (v==null || v==='') return null;
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(n) ? null : n;
  }

  function parseInBodyFile(file){
    return new Promise(function(resolve, reject){
      var isCsv = /\.csv$/i.test(file.name);
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        try{
          var wb = isCsv ?
            XLSX.read(String(reader.result), {type:'string'}) :
            XLSX.read(reader.result, {type:'array', cellDates:true});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var grid = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
          if (!grid.length){ resolve({rows:[], unmatched:true}); return; }
          var headers = grid[0].map(function(h){ return h==null?'':String(h); });
          var idx = {
            date: pickColumn(headers, ['testdate','date','時間','日期','測試日期','檢測日期','量測日期']),
            weight: pickColumn(headers, ['weight(kg)','weight','體重']),
            fatPercent: pickColumn(headers, ['pbf','bodyfatpercentage','bodyfat%','體脂率','脂肪率','體脂百分比']),
            fatKg: pickColumn(headers, ['bfm','fatmass','bodyfatmass','體脂肪','體脂重']),
            muscleKg: pickColumn(headers, ['smm','skeletalmuscle','骨骼肌','肌肉量']),
            visceralFat: pickColumn(headers, ['內臟脂肪等級','visceralfatlevel','vfl','內臟脂肪'], ['面積','area','cm2','cm²']),
            score: pickColumn(headers, ['inbodyscore','score','inbody分數','inbody評分','評分'])
          };
          if (idx.date===-1 || idx.weight===-1){ resolve({rows:[], unmatched:true}); return; }
          var rows = [];
          for (var r=1; r<grid.length; r++){
            var row = grid[r];
            if (!row) continue;
            var date = toISODateAny(row[idx.date]);
            var weightKg = toNum(row[idx.weight]);
            if (!date || weightKg==null) continue;
            rows.push({
              date: date,
              weightKg: weightKg,
              fatPercent: idx.fatPercent>-1 ? toNum(row[idx.fatPercent]) : null,
              fatKg: idx.fatKg>-1 ? toNum(row[idx.fatKg]) : null,
              muscleKg: idx.muscleKg>-1 ? toNum(row[idx.muscleKg]) : null,
              visceralFat: idx.visceralFat>-1 ? toNum(row[idx.visceralFat]) : null,
              score: idx.score>-1 ? toNum(row[idx.score]) : null
            });
          }
          resolve({rows:rows, unmatched:false});
        }catch(e){ reject(e); }
      };
      if (isCsv) reader.readAsText(file, 'utf-8'); else reader.readAsArrayBuffer(file);
    });
  }

  async function importInBodyRows(rows){
    rows.forEach(function(rec){
      var existing = mem.weights.find(function(w){ return w.date===rec.date; });
      if (existing){
        existing.weightKg = rec.weightKg;
        if (rec.fatPercent!=null) existing.fatPercent = rec.fatPercent;
        if (rec.fatKg!=null) existing.fatKg = rec.fatKg;
        if (rec.muscleKg!=null) existing.muscleKg = rec.muscleKg;
        if (rec.visceralFat!=null) existing.visceralFat = rec.visceralFat;
        if (rec.score!=null) existing.score = rec.score;
      } else {
        rec.id = uuid();
        mem.weights.push(rec);
      }
    });
    sortData();
    writeLocalStorage();
  }

  function fmtYMD(iso){ var p=iso.split('-'); return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'; }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function latestWeight(){
    return mem.weights.length ? mem.weights[mem.weights.length-1] : null;

  function latestInjection(){

  function currentBMI(){
    var lw = latestWeight();
    var kg = lw ? lw.weightKg : mem.profile.startWeight;
    var h = mem.profile.heightCm/100;
    if (!h) return null;

  function nextInjectionDate(){

  function recommendedSite(){
    var used = recentSites(3);
    for (var i=0;i<SITES.length;i++){
      if (used.indexOf(SITES[i].id) === -1) return SITES[i].id;
    }
    return SITES[0].id;
  }

  /* ---------- chart ---------- */
  function lineChart(points, opts){
    opts = opts || {};
    var W = 320, H = opts.height || 160, padL=34, padR=10, padT=16, padB=20;
    if (!points.length){
      return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-size="12">'+esc(L('chart_empty'))+'</text></svg>';
    }
    var xs = points.map(function(p){ return new Date(p.date).getTime(); });
    var ys = points.map(function(p){ return p.value; });
    if (opts.goal!=null) ys = ys.concat([opts.goal]);
    var xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
    var yMin=Math.min.apply(null,ys), yMax=Math.max.apply(null,ys);
    if (xMin===xMax){ xMin -= 86400000; xMax += 86400000; }
    if (yMin===yMax){ yMin -= 1; yMax += 1; }
    var pad = (yMax-yMin)*0.12;
    yMin -= pad; yMax += pad;
    function X(x){ return padL + (x-xMin)/(xMax-xMin) * (W-padL-padR); }
    function Y(y){ return H-padB - (y-yMin)/(yMax-yMin) * (H-padT-padB); }

    var d = points.map(function(p,i){
      var cmd = i===0 ? 'M' : 'L';
      return cmd + X(new Date(p.date).getTime()).toFixed(1) + ' ' + Y(p.value).toFixed(1);
    }).join(' ');
    var area = d + ' L' + X(xs[xs.length-1]).toFixed(1) + ' ' + (H-padB) + ' L' + X(xs[0]).toFixed(1) + ' ' + (H-padB) + ' Z';

    var gridY = [];
    for (var g=0; g<=2; g++){
      var gy = yMin + (yMax-yMin)*g/2;
      gridY.push('<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(gy).toFixed(1)+'" y2="'+Y(gy).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="'+(padL-6)+'" y="'+(Y(gy)+3).toFixed(1)+'" text-anchor="end" font-size="9.5">'+fmtKg(gy)+'</text>');
    }

    var goalLine = '';
    if (opts.goal!=null){
      goalLine = '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(opts.goal).toFixed(1)+'" y2="'+Y(opts.goal).toFixed(1)+'" stroke="var(--teal)" stroke-width="1.3" stroke-dasharray="3 3"/>';
    }

    var lastX = X(xs[xs.length-1]), lastY = Y(ys.length && opts.goal!=null ? points[points.length-1].value : points[points.length-1].value);
    var last = points[points.length-1];
    var xLabels = '<text x="'+padL+'" y="'+(H-4)+'" font-size="9.5">'+fmtMD(points[0].date)+'</text>' +
      '<text x="'+(W-padR)+'" y="'+(H-4)+'" text-anchor="end" font-size="9.5">'+fmtMD(points[points.length-1].date)+'</text>';

    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">' +
      '<defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>' +
        '<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      gridY.join('') + goalLine +
      '<path d="'+area+'" fill="url(#fillg)"/>' +
      '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="'+X(xs[xs.length-1]).toFixed(1)+'" cy="'+Y(points[points.length-1].value).toFixed(1)+'" r="3.6" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/>' +
      xLabels +
      '</svg>';
  }

      box.hidden = !box.hidden;
    };

    function fillFromExtract(obj){
      if (obj.date) document.getElementById('wf-date').value = obj.date;
      if (obj.weightKg!=null) document.getElementById('wf-weight').value = obj.weightKg;
      if (obj.fatPercent!=null) document.getElementById('wf-fatpct').value = obj.fatPercent;
      if (obj.fatKg!=null) document.getElementById('wf-fat').value = obj.fatKg;
      if (obj.muscleKg!=null) document.getElementById('wf-muscle').value = obj.muscleKg;
      if (obj.visceralFat!=null) document.getElementById('wf-visceral').value = obj.visceralFat;
      if (obj.score!=null) document.getElementById('wf-score').value = obj.score;
      if (obj.fatKg!=null || obj.muscleKg!=null || obj.visceralFat!=null || obj.score!=null){
        document.getElementById('wf-inbody-fields').hidden = false;
      }
    }

    if (aiAvailable){
      var aiBtn = document.getElementById('wf-ai-btn');
      var aiMsg = document.getElementById('wf-ai-msg');
      aiBtn.onclick = function(){ document.getElementById('wf-ai-input').click(); };
      document.getElementById('wf-ai-input').onchange = function(e){
        var f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        aiBtn.disabled = true;
        aiMsg.style.color = 'var(--ink-faint)';
        aiMsg.textContent = L('wf_aiRecognizing');
        var prompt = 'This is a photo of an InBody body-composition scale report. Read the printed values and reply with ONLY this JSON object (no other text), using null for any field not visible on the report:\n' +
          '{"date": "YYYY-MM-DD or null", "weightKg": number or null, "fatPercent": number or null (body fat %, PBF), "fatKg": number or null (body fat mass), "muscleKg": number or null (skeletal muscle mass, SMM), "visceralFat": number or null (visceral fat level), "score": number or null (InBody score)}';
        sampleCap.json(prompt, {images:f, modelTier:'default', cache:false}).then(function(obj){
          fillFromExtract(obj||{});
          var gotAny = obj && (obj.weightKg!=null || obj.fatPercent!=null || obj.fatKg!=null || obj.muscleKg!=null);
          aiMsg.style.color = gotAny ? 'var(--teal)' : 'var(--warn)';
          aiMsg.textContent = gotAny ? L('wf_aiFilled') : L('wf_aiEmpty');
        }).catch(function(err){
          var code = err && err.code;
          if (code==='not_granted' || code==='sampling_disabled' || code==='not_declared' || code==='capability_disabled' || code==='capability_removed' || code==='images_unavailable'){
            aiBtn.style.display = 'none';
            aiMsg.textContent = '';
            return;
          }
          aiMsg.style.color = 'var(--warn)';
          if (code==='image_rejected') aiMsg.textContent = L('wf_aiImageRejected');
          else if (code==='rate_limited') aiMsg.textContent = L('wf_aiRateLimited');
          else if (code==='cancelled') aiMsg.textContent = '';
          else aiMsg.textContent = L('wf_aiUpstream');
        }).finally(function(){ aiBtn.disabled = false; });
      };
    }

    document.getElementById('wf-save').onclick = function(){
      var v = +document.getElementById('wf-weight').value;
      if (!v){ document.getElementById('wf-weight').focus(); return; }
      function numOrNull(id){ var el = document.getElementById(id); return el.value ? +el.value : null; }
      var rec = {
        date: document.getElementById('wf-date').value || todayISO,
        weightKg: v,
        fatPercent: numOrNull('wf-fatpct'),
        fatKg: numOrNull('wf-fat'),
        muscleKg: numOrNull('wf-muscle'),
        visceralFat: numOrNull('wf-visceral'),
        score: numOrNull('wf-score')
      };
      addWeight(rec).then(function(){
        closeSheet(); renderHome(); renderWeight();
      });
    };
  }

  /* ---------- AI analysis (Gemini, free web app — no API key stored in the page) ---------- */
  function buildSummaryText(){
    var p = mem.profile;
    var genderText = p.gender==='female'?L('gender_female'):p.gender==='male'?L('gender_male'):L('gender_other');
    var lines = [];
    lines.push(L('ai_intro'));
    lines.push('');
    lines.push(L('ai_basicHeader'));
    lines.push(L('ai_genderHeight',{gender:genderText, h:p.heightCm}));
    lines.push(L('ai_startGoal',{start:fmtKg(p.startWeight), goal:fmtKg(p.goalWeight)}));
    lines.push(L('ai_medCycle',{med:p.medication, days:p.intervalDays}));
    lines.push('');
    lines.push(L('ai_weightHeader'));
    if (mem.weights.length){
      mem.weights.slice().reverse().forEach(function(w){
        lines.push(w.date + '  ' + fmtKg(w.weightKg) + '  ' + (w.fatPercent!=null?fmtKg(w.fatPercent):'-') + '  ' + (w.fatKg!=null?fmtKg(w.fatKg):'-') + '  ' + (w.muscleKg!=null?fmtKg(w.muscleKg):'-') + '  ' + (w.visceralFat!=null?w.visceralFat:'-') + '  ' + (w.score!=null?w.score:'-'));
      });
    } else { lines.push(L('ai_noRecords')); }
    lines.push('');
    lines.push(L('ai_shotHeader'));
    if (mem.injections.length){
      mem.injections.slice().reverse().forEach(function(r){
        lines.push(r.date + '  ' + fmtKg(r.doseMg) + 'mg  ' + siteLabel(r.site));
      });
    } else { lines.push(L('ai_noRecords')); }
    return lines.join('\n');
  }

  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  function copyToClipboard(text){
    return new Promise(function(resolve){
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ resolve(true); }).catch(function(){ resolve(fallbackCopy(text)); });
      } else {
        resolve(fallbackCopy(text));
      }
    });
  }

  function openAISheet(){
    var text = buildSummaryText();
    sheetBody.innerHTML =
      '<div class="sheet-head"><h3>'+esc(L('ai_title'))+'</h3><button id="closeSheet">✕</button></div>' +
      '<div class="note" style="margin-bottom:10px">'+esc(L('ai_note'))+'</div>' +
      '<div class="ai-preview">'+esc(text)+'</div>' +
      '<div class="action-row" style="margin-top:12px">' +
        '<button class="btn ghost" id="aiCopyBtn">'+esc(L('ai_copyBtn'))+'</button>' +
        '<a class="btn primary" id="aiOpenBtn" href="https://gemini.google.com/app" target="_blank" rel="noopener">'+esc(L('ai_openBtn'))+'</a>' +
      '</div>';
    overlay.classList.add('open');
    document.getElementById('closeSheet').onclick = closeSheet;
    document.getElementById('aiCopyBtn').onclick = function(){
      var btn = this;
      copyToClipboard(text).then(function(ok){
        btn.textContent = ok ? L('msg_copied') : L('msg_copyFailedManual');
        setTimeout(function(){ btn.textContent = L('ai_copyBtn'); }, 1800);
      });
    };
  }

  /* ---------- nav / boot ---------- */
  function switchView(name){
    currentView = name;
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.getAttribute('data-view')===name); });
    document.querySelectorAll('nav.bottom button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===name); });
    document.getElementById('viewTitle').innerHTML = esc(L('title_'+name));
    if (name==='home') renderHome();
    if (name==='weight') renderWeight();
    if (name==='shot') renderShot();
    if (name==='settings') renderSettings();
  }
  document.getElementById('navBar').addEventListener('click', function(e){
    var b = e.target.closest('[data-nav]');
    if (b) switchView(b.getAttribute('data-nav'));
  });

  function updateNavLabels(){
    document.getElementById('navLabelHome').textContent = L('nav_home');
    document.getElementById('navLabelWeight').textContent = L('nav_weight');
    document.getElementById('navLabelShot').textContent = L('nav_shot');
    document.getElementById('navLabelSettings').textContent = L('nav_settings');
  }

  function updateDayBadge(){
    var streak = mem.weights.length ? Math.max(1, daysBetween(mem.weights[0].date, todayISO)) : 1;
    document.getElementById('dayBadge').textContent = L('dayBadge', {n:streak});
  }

  initPersistence().then(function(){
    LANG = (mem.profile && mem.profile.lang) || 'zh';
    updateNavLabels();
    updateDayBadge();
    switchView('home');
  });
})();
</script>

</html>
